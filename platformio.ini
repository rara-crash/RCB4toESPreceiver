; RCB4toESPreceiver - M5Stamp Pico を近藤科学 KRR-5FH に擬態させて RCB-4 へボタン情報を返す
; StampPad / BTGamepad は Bluedroid の内部API を使うため Arduino-ESP32 2.x 系 (espressif32@6.5.0) に固定
[env:m5stamp-pico]
platform = espressif32@6.5.0
board = m5stamp-pico
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Classic + BLE の Bluedroid はサイズが大きいので OTA なしの大容量パーティションにする
board_build.partitions = huge_app.csv
; 共有ライブラリ (OneDrive/ドキュメント/PlatformIO/Libraries) を英字パスのジャンクション経由で参照する
lib_extra_dirs = C:/Users/kotar/pio-libs
build_flags =
    -DCORE_DEBUG_LEVEL=1
